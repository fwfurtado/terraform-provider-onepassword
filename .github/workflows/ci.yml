name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gofmt diff (all files)
        run: |
          gofmt -d . > /tmp/gofmt.diff
          echo "GOFMT_DIFF<<EOF" >> $GITHUB_ENV
          cat /tmp/gofmt.diff >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Comment gofmt diff (all files)
        uses: actions/github-script@v6
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              return;
            }

            if (context.payload.pull_request?.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              return;
            }

            const diff = process.env.GOFMT_DIFF || '';
            if (!diff.trim()) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            const commit_id = context.sha;

            const comments = parseDiff(diff, commit_id);

            for (const comment of comments) {
              await github.rest.pulls.createReviewComment({
                owner,
                repo,
                pull_number,
                ...comment,
              });
            }

            function parseDiff(diffText, commitId) {
              let filePath = null;
              let oldLine = 0;
              let newLine = 0;
              let hunkActive = false;
              let removedLines = [];
              let addedLines = [];
              let hunkOldStart = null;
              let hunkNewStart = null;
              let firstRemovedLine = null;
              let firstAddedLine = null;
              const results = [];

              const flushHunk = () => {
                if (!filePath || !hunkActive) {
                  return;
                }

                const leftLine = firstRemovedLine ?? hunkOldStart;
                if (removedLines.length > 0 && leftLine !== null) {
                  results.push({
                    commit_id: commitId,
                    path: filePath,
                    line: leftLine,
                    side: 'LEFT',
                    body: `gofmt:\n${removedLines.join('\n')}`,
                  });
                }

                const rightLine = firstAddedLine ?? hunkNewStart;
                if (addedLines.length > 0 && rightLine !== null) {
                  results.push({
                    commit_id: commitId,
                    path: filePath,
                    line: rightLine,
                    side: 'RIGHT',
                    body: `gofmt:\n${addedLines.join('\n')}`,
                  });
                }

                removedLines = [];
                addedLines = [];
                hunkOldStart = null;
                hunkNewStart = null;
                firstRemovedLine = null;
                firstAddedLine = null;
                hunkActive = false;
              };

              for (const line of diffText.split('\n')) {
                if (line.startsWith('diff ')) {
                  flushHunk();
                  filePath = null;
                  oldLine = 0;
                  newLine = 0;
                  continue;
                }

                if (line.startsWith('+++ ')) {
                  filePath = line.replace('+++ ', '').trim();
                  if (filePath.startsWith('a/') || filePath.startsWith('b/')) {
                    filePath = filePath.slice(2);
                  }
                  continue;
                }

                const hunk = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
                if (hunk) {
                  flushHunk();
                  oldLine = parseInt(hunk[1], 10);
                  newLine = parseInt(hunk[2], 10);
                  hunkOldStart = oldLine;
                  hunkNewStart = newLine;
                  firstRemovedLine = null;
                  firstAddedLine = null;
                  hunkActive = true;
                  continue;
                }

                if (!filePath || line.startsWith('--- ')) continue;

                if (line.startsWith('+') && !line.startsWith('+++')) {
                  addedLines.push(line);
                  if (firstAddedLine === null) {
                    firstAddedLine = newLine;
                  }
                  newLine++;
                  continue;
                }

                if (line.startsWith('-') && !line.startsWith('---')) {
                  removedLines.push(line);
                  if (firstRemovedLine === null) {
                    firstRemovedLine = oldLine;
                  }
                  oldLine++;
                  continue;
                }

                if (line.startsWith(' ')) {
                  oldLine++;
                  newLine++;
                }
              }

              flushHunk();

              return results;
            }
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required:"
            echo "$unformatted"
            exit 1
          fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...