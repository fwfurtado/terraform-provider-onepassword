name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gofmt diff (all files)
        run: |
          gofmt -d . > /tmp/gofmt.diff
          echo "GOFMT_DIFF<<EOF" >> $GITHUB_ENV
          cat /tmp/gofmt.diff >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Comment gofmt diff (all files)
        uses: actions/github-script@v6
        with:
          script: |
            if (context.payload.pull_request?.head?.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              return;
            }

            const diff = process.env.GOFMT_DIFF || '';
            if (!diff.trim()) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;
            const commit_id = context.payload.pull_request?.head?.sha;
            if (!commit_id) {
              return;
            }

            const annotations = parseDiff(diff);
            if (annotations.length === 0) return;

            const MAX_ANNOTATIONS = 50;
            for (let i = 0; i < annotations.length; i += MAX_ANNOTATIONS) {
              const chunk = annotations.slice(i, i + MAX_ANNOTATIONS);
              await github.rest.checks.create({
                owner,
                repo,
                name: 'gofmt',
                head_sha: commit_id,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'gofmt required',
                  summary: 'gofmt reported formatting differences.',
                  annotations: chunk,
                },
              });
            }

            function parseDiff(diffText) {
              let filePath = null;
              let oldLine = 0;
              let newLine = 0;
              let hunkActive = false;
              let removedLines = [];
              let addedLines = [];
              let hunkOldStart = null;
              let hunkNewStart = null;
              let firstRemovedLine = null;
              let firstAddedLine = null;
              const results = [];

              const flushHunk = () => {
                if (!filePath || !hunkActive) {
                  return;
                }

                const anchorLine = firstAddedLine ?? hunkNewStart;
                if (anchorLine !== null) {
                  const messageLines = [...removedLines, ...addedLines];
                  const addedCount = addedLines.length || 1;
                  results.push({
                    path: filePath,
                    start_line: anchorLine,
                    end_line: anchorLine + addedCount - 1,
                    annotation_level: 'failure',
                    message: `gofmt:\n${messageLines.join('\n')}`,
                  });
                }

                removedLines = [];
                addedLines = [];
                hunkOldStart = null;
                hunkNewStart = null;
                firstRemovedLine = null;
                firstAddedLine = null;
                hunkActive = false;
              };

              for (const line of diffText.split('\n')) {
                if (line.startsWith('diff ')) {
                  flushHunk();
                  filePath = null;
                  oldLine = 0;
                  newLine = 0;
                  continue;
                }

                if (line.startsWith('+++ ')) {
                  filePath = line.replace('+++ ', '').trim();
                  if (filePath.startsWith('a/') || filePath.startsWith('b/')) {
                    filePath = filePath.slice(2);
                  }
                  continue;
                }

                const hunk = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
                if (hunk) {
                  flushHunk();
                  oldLine = parseInt(hunk[1], 10);
                  newLine = parseInt(hunk[2], 10);
                  hunkOldStart = oldLine;
                  hunkNewStart = newLine;
                  firstRemovedLine = null;
                  firstAddedLine = null;
                  hunkActive = true;
                  continue;
                }

                if (!filePath || line.startsWith('--- ')) continue;

                if (line.startsWith('+') && !line.startsWith('+++')) {
                  addedLines.push(line);
                  if (firstAddedLine === null) {
                    firstAddedLine = newLine;
                  }
                  newLine++;
                  continue;
                }

                if (line.startsWith('-') && !line.startsWith('---')) {
                  removedLines.push(line);
                  if (firstRemovedLine === null) {
                    firstRemovedLine = oldLine;
                  }
                  oldLine++;
                  continue;
                }

                if (line.startsWith(' ')) {
                  oldLine++;
                  newLine++;
                }
              }

              flushHunk();

              return results;
            }
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required:"
            echo "$unformatted"
            exit 1
          fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...